# Opens every Droppo window on a real Windows machine, saves a picture of each, and puts the
# pictures on the "previews" branch. A quick way to check the look after a change.
name: Previews

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - ".github/workflows/previews.yml"
      - "installer/whisper-version.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  previews:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build src/Droppo/Droppo.csproj -c Release -o build

      - name: Turn on Windows transparency effects (so glass can be checked)
        shell: pwsh
        run: |
          New-Item -Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize -Force | Out-Null
          Set-ItemProperty -Path HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize -Name EnableTransparency -Value 1 -Type DWord

      - name: Draw every window
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force previews | Out-Null
          $p = Start-Process -FilePath (Resolve-Path build/Droppo.exe) -ArgumentList '--previews', "`"$PWD\previews`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); "timed out" | Out-File previews/timeout.txt }
          Get-ChildItem previews | Format-Table Name, Length

      - name: Get FFmpeg and whisper.cpp (for the Transcribe check)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          New-Item -ItemType Directory -Force previews/transcribe, build/tools/ffmpeg, build/tools/whisper-cli | Out-Null
          Invoke-WebRequest https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip -OutFile ff.zip -UseBasicParsing
          Expand-Archive ff.zip -DestinationPath ffx -Force
          Copy-Item (Get-ChildItem ffx -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName build/tools/ffmpeg/
          $pinned = (Get-Content installer/whisper-version.txt -Raw).Trim()
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/whisper.cpp/releases/tags/$pinned" -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -eq 'whisper-bin-x64.zip' } | Select-Object -First 1
          "using $($release.tag_name) $($asset.name)" | Out-File previews/transcribe/whisper-release.txt
          Invoke-WebRequest $asset.browser_download_url -OutFile w.zip -UseBasicParsing
          Expand-Archive w.zip -DestinationPath wx -Force
          $cli = Get-ChildItem wx -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          (Get-ChildItem $cli.DirectoryName | ForEach-Object { "$($_.Name) $($_.Length)" }) -join "`n" | Out-File previews/transcribe/whisper-files.txt
          Get-ChildItem $cli.DirectoryName -File | Where-Object { $_.Name -in 'whisper-cli.exe', 'whisper.dll' -or $_.Name -like 'ggml*.dll' } | Copy-Item -Destination build/tools/whisper-cli
          foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll', 'vcomp140.dll') { if (Test-Path "$env:WINDIR\System32\$dll") { Copy-Item "$env:WINDIR\System32\$dll" build/tools/whisper-cli } }
          & build/tools/whisper-cli/whisper-cli.exe --help *> previews/transcribe/whisper-help.txt
          "exit $LASTEXITCODE" | Add-Content previews/transcribe/whisper-help.txt
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          Get-ChildItem build/tools/whisper-cli -File | ForEach-Object { & $dumpbin.FullName /nologo /dependents $_.FullName } | Out-File previews/transcribe/whisper-deps.txt

      - name: Say something with Windows' voice
        continue-on-error: true
        shell: powershell
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          ($s.GetInstalledVoices() | ForEach-Object { $_.VoiceInfo.Name }) -join ', ' | Out-File previews/transcribe/voices.txt
          $s.Rate = 0
          $s.SetOutputToWaveFile("$PWD\previews\transcribe\speech.wav")
          $s.Speak("The quick brown fox jumps over the lazy dog. Droppo turns speech into text, right on your own computer.")
          $s.Dispose()
          Copy-Item previews/transcribe/speech.wav "previews/transcribe/caf$([char]0xE9) notes.wav"
          & build/tools/ffmpeg/ffmpeg.exe -hide_banner -loglevel error -y -stream_loop 9 -i previews/transcribe/speech.wav -c copy previews/transcribe/zz-long.wav
          & build/tools/ffmpeg/ffmpeg.exe -hide_banner -loglevel error -y -f lavfi -i color=c=0x3882F6:s=640x360:r=25 -i previews/transcribe/speech.wav -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac previews/transcribe/speech-video.mp4

      - name: Transcribe them with Droppo
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path build/Droppo.exe) -ArgumentList '--transcribe-test', "`"$PWD\previews\transcribe`"" -PassThru
          if (-not $p.WaitForExit(900000)) { $p.Kill(); "timed out" | Out-File previews/transcribe/timeout.txt }
          Get-Content previews/transcribe/results.txt -ErrorAction SilentlyContinue
          Remove-Item previews/transcribe/*.wav, previews/transcribe/*.mp4 -ErrorAction SilentlyContinue

      - name: Put the pictures on the previews branch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item previews/* out -Recurse
          "Previews for ${{ github.sha }}" | Out-File out/README.md
          Set-Location out
          git init -b previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Previews for ${{ github.sha }}"
          git push --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" previews
