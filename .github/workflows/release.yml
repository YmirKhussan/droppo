# Builds Droppo-Setup-<version>.exe on a Windows machine at GitHub.
#  - Push to main with a new <Version> in src/Droppo/Droppo.csproj -> builds it and publishes release v<version>.
#    (Same version as an existing release -> builds it as a downloadable artifact only, nothing is overwritten.)
#  - Pushing a tag like v0.6.1, or Actions tab > "Build installer" > Run workflow, also works.
name: Build installer

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "src/**"
      - "installer/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Get qpdf
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Uri https://api.github.com/repos/qpdf/qpdf/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -like '*msvc64.zip' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows (msvc64) zip in qpdf $($release.tag_name)" }
          Write-Host "qpdf $($release.tag_name): $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile qpdf.zip -UseBasicParsing
          Expand-Archive qpdf.zip -DestinationPath C:\qpdf -Force
          $exe = Get-ChildItem C:\qpdf -Recurse -Filter qpdf.exe | Select-Object -First 1
          if (-not $exe) { throw "qpdf.exe not found in $($asset.name)" }
          Add-Content $env:GITHUB_PATH $exe.DirectoryName
          & $exe.FullName --version

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -NoOpen

      - name: Is this a new version?
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$xml = Get-Content src/Droppo/Droppo.csproj
          $v = ($xml.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ } | Select-Object -First 1)
          "tag=v$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT; Write-Host "v$v is already released: keeping it, artifact only." }
          else { "new=true" >> $env:GITHUB_OUTPUT; Write-Host "v$v is new: publishing a release." }
          exit 0

      - name: Keep the installer (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Droppo-Setup
          path: dist/Droppo-Setup-*.exe

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Droppo ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/Droppo-Setup-*.exe
          generate_release_notes: true
          body: |
            **Drop it. Done.**

            Download `Droppo-Setup-*.exe` below and double-click it. Windows 10 or 11 (64-bit).

            Windows may say "Windows protected your PC" because the app isn't code-signed yet: click **More info** > **Run anyway**.
