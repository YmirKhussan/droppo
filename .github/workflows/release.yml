# Builds Droppo-Setup-<version>.exe on a Windows machine at GitHub.
#  - Push a tag like v0.6.0  -> builds and publishes it on the Releases page.
#  - Actions tab > "Build installer" > Run workflow -> builds it as a downloadable artifact (no release).
name: Build installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Get qpdf
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Invoke-RestMethod -Uri https://api.github.com/repos/qpdf/qpdf/releases/latest -Headers @{ Authorization = "Bearer $env:GH_TOKEN" }
          $asset = $release.assets | Where-Object { $_.name -like '*msvc64.zip' } | Select-Object -First 1
          if (-not $asset) { throw "No Windows (msvc64) zip in qpdf $($release.tag_name)" }
          Write-Host "qpdf $($release.tag_name): $($asset.name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile qpdf.zip -UseBasicParsing
          Expand-Archive qpdf.zip -DestinationPath C:\qpdf -Force
          $exe = Get-ChildItem C:\qpdf -Recurse -Filter qpdf.exe | Select-Object -First 1
          if (-not $exe) { throw "qpdf.exe not found in $($asset.name)" }
          Add-Content $env:GITHUB_PATH $exe.DirectoryName
          & $exe.FullName --version

      - name: Build installer
        shell: pwsh
        run: ./installer/build.ps1 -NoOpen

      - name: Keep the installer (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Droppo-Setup
          path: dist/Droppo-Setup-*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Droppo-Setup-*.exe
          generate_release_notes: true
          body: |
            **Drop it. Done.**

            Download `Droppo-Setup-*.exe` below and double-click it. Windows 10 or 11 (64-bit).

            Windows may say "Windows protected your PC" because the app isn't code-signed yet: click **More info** > **Run anyway**.
